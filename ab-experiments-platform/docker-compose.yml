name: ab-experiments

services:
  postgres:
    image: postgres:15
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_DB: ab
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ab"]
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka-ui:
    image: redpandadata/console:v3.3.1
    ports:
      - "8093:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  debezium:
    image: debezium/connect:2.5
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8094:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: ab-debezium
      CONFIG_STORAGE_TOPIC: ab_debezium_configs
      OFFSET_STORAGE_TOPIC: ab_debezium_offsets
      STATUS_STORAGE_TOPIC: ab_debezium_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      PLUGIN_PATH: /kafka/connect
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  debezium-init:
    image: curlimages/curl:8.5.0
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./debezium/init-debezium.sh:/init-debezium.sh:ro
    entrypoint: ["sh", "/init-debezium.sh"]

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8129:8123"
      - "9019:9000"
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      CLICKHOUSE_DB: ab
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/01-raw.sql:/docker-entrypoint-initdb.d/01-raw.sql
      - ./clickhouse/02-user-level.sql:/docker-entrypoint-initdb.d/02-user-level.sql
      - ./clickhouse/03-results.sql:/docker-entrypoint-initdb.d/03-results.sql
    depends_on:
      kafka:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "admin", "--password", "admin123", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  assignment-service:
    build: ./assignment-service
    ports:
      - "8092:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ab
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: on-failure

  traffic-simulator:
    build: ./traffic-simulator
    environment:
      AB_ASSIGNMENT_URL: http://assignment-service:8080
    depends_on:
      assignment-service:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: on-failure

  dbt:
    build:
      context: ./dbt
    image: ab-experiments-dbt:latest
    depends_on:
      clickhouse:
        condition: service_healthy
      traffic-simulator:
        condition: service_healthy
    environment:
      CLICKHOUSE_HTTP: http://clickhouse:8123/?user=admin&password=admin123
      DBT_MIN_USER_LEVEL: "1000"
      DBT_WAIT_SECONDS: "600"
    # First-boot bootstrap: wait for CDC user_level, then seed/run/test.
    # Image stays tagged as ab-experiments-dbt:latest for Airflow DockerOperator.
    entrypoint: ["/bin/bash", "/usr/app/bootstrap.sh"]

  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow:
    build: ./airflow
    user: root
    depends_on:
      airflow-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      dbt:
        condition: service_completed_successfully
      traffic-simulator:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      PYTHONPATH: /home/airflow/.local/lib/python3.8/site-packages
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8096:8080"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        airflow db migrate
        airflow connections create-default-connections || true
        airflow users create --username admin --firstname Air --lastname Flow --role Admin --email admin@example.com --password admin || true
        airflow dags unpause ab_experiments_analysis || true
        airflow webserver &
        exec airflow scheduler

  superset:
    build: ./superset
    ports:
      - "8095:8088"
    depends_on:
      clickhouse:
        condition: service_healthy
      dbt:
        condition: service_completed_successfully
    volumes:
      - superset-home:/app/superset_home
    entrypoint: ["/superset/docker-entrypoint.sh"]
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_home/superset_config.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure

volumes:
  postgres-data:
  clickhouse-data:
  superset-home:
