name: logistics-control-tower

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic logistics.gps_pings --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic logistics.trip_events --partitions 3 --replication-factor 1 &&
        echo 'topics ready'
      "

  kafka-ui:
    image: redpandadata/console:v3.3.1
    ports:
      - "8094:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8130:8123"
      - "9020:9000"
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      CLICKHOUSE_DB: logistics
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/01-raw.sql:/docker-entrypoint-initdb.d/01-raw.sql
      - ./clickhouse/02-h3.sql:/docker-entrypoint-initdb.d/02-h3.sql
      - ./clickhouse/03-sla.sql:/docker-entrypoint-initdb.d/03-sla.sql
      - ./clickhouse/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "admin", "--password", "admin123", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  trip-simulator:
    build: ./trip-simulator
    ports:
      - "8095:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOGISTICS_GPS_TOPIC: logistics.gps_pings
      LOGISTICS_EVENTS_TOPIC: logistics.trip_events
      LOGISTICS_ACTIVE_TRIPS: "40"
      LOGISTICS_TICK_MS: "5000"
      LOGISTICS_BACKFILL_HOURS: "3"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: on-failure

  grafana:
    image: grafana/grafana:10.2.3
    ports:
      - "3010:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ../iot-pipeline/grafana/plugins:/var/lib/grafana/plugins:ro
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
  grafana-data:
