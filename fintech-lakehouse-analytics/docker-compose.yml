version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: fintech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demo -d fintech" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      my-network:

  debezium:
    image: debezium/connect:2.5
    container_name: debezium
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: false
      KEY_CONVERTER_SCHEMAS_ENABLE: false
      PLUGIN_PATH: /kafka/connect
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      my-network:

  debezium-init:
    image: curlimages/curl:8.5.0
    depends_on:
      debezium:
        condition: service_healthy
    volumes:
      - ./debezium/init-debezium.sh:/init-debezium.sh
    entrypoint: [ "sh", "/init-debezium.sh" ]
    networks:
      my-network:

  data-loader:
    image: postgres:15
    container_name: fintech-data-loader
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      debezium:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: demo
    volumes:
      - ./postgres/seed.sql:/seed.sql
    entrypoint:
      - bash
      - -c
      - |
        until curl -s http://debezium:8083/connectors | grep -q postgres-fintech-connector; do
          echo "Waiting for Debezium connector..."
          sleep 3
        done
        psql -h postgres -U demo -d fintech -v ON_ERROR_STOP=1 -f /seed.sql
        echo "CDC seed load completed"
    networks:
      my-network:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
    networks:
      my-network:

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      my-network:

  kafka-ui:
    image: redpandadata/console:v3.3.1
    depends_on:
      kafka:
        condition: service_healthy
    ports: [ "8088:8080" ]
    environment:
      - KAFKA_BROKERS=kafka:9092
    networks:
      my-network:

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      CLICKHOUSE_DB: default
    networks:
      my-network:

  dbt:
    build:
      context: ./dbt
    container_name: dbt
    depends_on:
      clickhouse:
        condition: service_started
    working_dir: /usr/app
    entrypoint: [ "dbt" ]
    command: [ "run" ]
    networks:
      my-network:

  superset:
    build:
      context: ./superset
    container_name: superset
    depends_on:
      clickhouse:
        condition: service_started
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_home/superset_config.py
    ports:
      - "8089:8088"
    volumes:
      - superset-home:/app/superset_home
    networks:
      my-network:

  airflow:
    user: root
    image: apache/airflow:2.8.1
    container_name: airflow
    restart: always
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    ports:
      - "8081:8080"
    command: bash -c "
      airflow db init &&
      airflow db migrate &&
      airflow users create \
      --username admin \
      --firstname Air \
      --lastname Flow \
      --role Admin \
      --email admin@example.com \
      --password admin &&
      airflow webserver &
      airflow scheduler"
    networks:
      my-network:

  airflow-db:
    image: postgres:15
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      my-network:


volumes:
  pgdata:
  clickhouse-data:
  superset-home:
networks:
  my-network: