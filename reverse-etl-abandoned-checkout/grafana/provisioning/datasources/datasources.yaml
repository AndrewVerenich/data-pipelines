apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse-retl
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      defaultDatabase: retl
      port: 8123
      host: clickhouse
      username: admin
      protocol: http
      tlsSkipVerify: true
    secureJsonData:
      password: admin123

  - name: Postgres
    uid: postgres-retl
    type: postgres
    access: proxy
    url: postgres:5432
    user: admin
    database: retl
    jsonData:
      sslmode: disable
      postgresVersion: 1500
    secureJsonData:
      password: admin123
