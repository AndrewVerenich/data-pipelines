version: 2

models:
  - name: stg_products_ref
    tests:
      - non_negative_unit_price

  - name: stg_events
    columns:
      - name: user_id
        tests:
          - not_null
      - name: event_ts
        tests:
          - not_null
      - name: ingest_batch_id
        tests:
          - not_null

  - name: dim_user
    columns:
      - name: user_sk
        tests:
          - not_null
          - unique
      - name: user_id
        tests:
          - not_null
          - unique

  - name: dim_product
    columns:
      - name: product_sk
        tests:
          - not_null
          - unique
      - name: product_id
        tests:
          - not_null

  - name: fct_events
    columns:
      - name: event_sk
        tests:
          - not_null
          - unique
      - name: user_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_sk

  - name: mart_daily_sessions
    columns:
      - name: event_date
        tests:
          - not_null
      - name: session_id
        tests:
          - not_null

  - name: mart_events_by_device
    columns:
      - name: event_date
        tests:
          - not_null

  - name: mart_product_scd_demo
    columns:
      - name: product_sk
        tests:
          - not_null

seeds:
  - name: seed_product_scd
    columns:
      - name: product_id
        tests:
          - not_null
