version: 2

models:
  - name: feat_transaction_scoring
    description: >
      Point-in-time scoring features. Velocity windows count only prior transactions
      (event_ts strictly less than current). Labels are attached for training export
      and must not be used as model inputs.
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: amount
        tests: [not_null]
      - name: user_tx_cnt_1h
        tests: [not_null]
      - name: cat_mcc
        tests: [not_null]
