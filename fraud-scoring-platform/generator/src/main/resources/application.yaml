spring:
  application:
    name: fraud-generator
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP:kafka:9092}}
  main:
    banner-mode: "off"

app:
  backfill-days: ${BACKFILL_DAYS:14}
  backfill-tx: ${BACKFILL_TX:12000}
  fraud-rate: ${FRAUD_RATE:0.04}
  stream-interval-ms: ${STREAM_INTERVAL_MS:400}
  num-users: ${NUM_USERS:800}
  num-merchants: ${NUM_MERCHANTS:120}

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
