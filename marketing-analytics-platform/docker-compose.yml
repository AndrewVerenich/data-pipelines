version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  kafka-ui:
    image: redpandadata/console:v3.3.1
    ports: [ "8080:8080" ]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=kafka:9092

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/01-raw-layer.sql:/docker-entrypoint-initdb.d/01-raw-layer.sql
      - ./clickhouse/02-dimension-tables.sql:/docker-entrypoint-initdb.d/02-dimension-tables.sql
      - ./clickhouse/03-fact-tables.sql:/docker-entrypoint-initdb.d/03-fact-tables.sql
      - ./clickhouse/04-aggregated-tables.sql:/docker-entrypoint-initdb.d/04-aggregated-tables.sql
      - ./clickhouse/05-materialized-views.sql:/docker-entrypoint-initdb.d/05-materialized-views.sql
      - ./clickhouse/06-projections-indexes.sql:/docker-entrypoint-initdb.d/06-projections-indexes.sql
      - ./clickhouse/08-backfill-website-history.sql:/docker-entrypoint-initdb.d/08-backfill-website-history.sql
      - ./clickhouse/09-backfill-ad-history.sql:/docker-entrypoint-initdb.d/09-backfill-ad-history.sql
      - ./clickhouse/10-backfill-backend-history.sql:/docker-entrypoint-initdb.d/10-backfill-backend-history.sql
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      CLICKHOUSE_DB: marketing
    depends_on:
      kafka:
        condition: service_healthy

  event-producer:
    build:
      context: ./event-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    restart: on-failure

  superset:
    build:
      context: ./superset
    ports:
      - "8088:8088"
    depends_on:
      - clickhouse
    volumes:
      - superset-home:/app/superset_home
    entrypoint: ["/superset/docker-entrypoint.sh"]
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_home/superset_config.py

volumes:
  clickhouse-data:
  superset-home: