version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
        echo 'Creating topics...' &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic raw_events --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud_rules --partitions 1 --replication-factor 1 --config cleanup.policy=compact &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user_segments --partitions 1 --replication-factor 1 --config cleanup.policy=compact &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic dead_letter --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic session_events --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud_alerts --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic funnel_events --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic events_per_type --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic page_views --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic unique_users_per_page --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic activity_heatmap --partitions 1 --replication-factor 1 &&
        echo 'Topics ready.'
      "
    restart: on-failure

  kafka-ui:
    image: redpandadata/console:v3.3.1
    ports: [ "8088:8080" ]
    environment:
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  gateway-websocket:
    build: ./gateway-websocket
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  clickstream-emulator:
    build: ./clickstream-emulator
    environment:
      - WS_URL=ws://gateway-websocket:8080/ws/events
      - SEND_INTERVAL_MS=200
    depends_on:
      gateway-websocket:
        condition: service_healthy

  config-publisher:
    build: ./config-publisher
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  jobmanager:
    image: flink:1.17.1-scala_2.12
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        rest.port: 8081
        state.backend: hashmap
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        state.savepoints.dir: file:///tmp/flink-savepoints
        execution.checkpointing.interval: 60000
    ports:
      - "8081:8081"
      - "6123:6123"
    volumes:
      - ./flink-job/build/libs:/jars
      - flink-checkpoints:/flink-checkpoints
      - flink-savepoints:/flink-savepoints
    depends_on:
      kafka:
        condition: service_healthy

  taskmanager:
    image: flink:1.17.1-scala_2.12
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.numberOfTaskSlots: 4
        state.backend: hashmap
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        state.savepoints.dir: file:///tmp/flink-savepoints
    volumes:
      - ./flink-job/build/libs:/jars
      - flink-checkpoints:/flink-checkpoints
      - flink-savepoints:/flink-savepoints
    depends_on:
      - jobmanager

  flink-job:
    image: flink:1.17.1-scala_2.12
    depends_on:
      jobmanager:
        condition: service_started
      gateway-websocket:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      config-publisher:
        condition: service_started
    volumes:
      - ./flink-job/build/libs:/jars
    command:
      - /opt/flink/bin/flink
      - run
      - -d
      - -m
      - jobmanager:8081
      - -c
      - com.example.flink.ClickstreamAnalyticsJob
      - /jars/flink-job.jar

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      CLICKHOUSE_DB: default
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:10.2.3
    ports:
      - "3000:3000"
    depends_on:
      - clickhouse
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/plugins:/var/lib/grafana/plugins
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-clickhouse-datasource
    restart: on-failure

volumes:
  clickhouse-data:
  grafana-storage:
  flink-checkpoints:
  flink-savepoints:
